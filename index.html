<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Memos</title>
<meta name="description" content="iPhone-style voice recorder for the web. Record, play, rename, share — works offline.">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    background:#0a0a0c;color:#fff;display:flex;justify-content:center;
    -webkit-font-smoothing:antialiased;user-select:none;overflow:hidden;}
  #phone{width:100%;max-width:430px;height:100dvh;background:#000;position:relative;overflow:hidden;
    display:flex;flex-direction:column;}
  @media (min-width:480px){
    body{align-items:center;padding:24px;}
    #phone{height:min(900px,calc(100dvh - 48px));border-radius:44px;
      box-shadow:0 30px 80px rgba(0,0,0,.6), 0 0 0 10px #1a1a1e, 0 0 0 12px #333;}
  }
  /* nav */
  .navbar{padding:calc(12px + env(safe-area-inset-top)) 16px 6px;display:flex;align-items:flex-end;
    justify-content:space-between;flex-shrink:0;}
  .largetitle{font-size:32px;font-weight:700;letter-spacing:-.5px;}
  .navbtn{background:none;border:none;color:#0a84ff;font-size:17px;cursor:pointer;padding:6px 2px;}
  .navbtn:active{opacity:.4;}
  .searchbar{margin:6px 16px 4px;background:#1c1c1e;border-radius:10px;display:flex;align-items:center;
    padding:7px 10px;gap:6px;}
  .searchbar input{border:none;outline:none;background:none;font-size:16px;width:100%;color:#fff;font-family:inherit;}
  .searchbar input::placeholder{color:#8e8e93;}
  /* list */
  #list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .memo{padding:12px 16px;border-bottom:.5px solid #1c1c1e;cursor:pointer;}
  .memo:active{background:#111;}
  .memo .top{display:flex;align-items:baseline;gap:8px;}
  .memo .nm{font-size:16px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .memo .du{font-size:13px;color:#8e8e93;font-variant-numeric:tabular-nums;}
  .memo .sub{font-size:13px;color:#8e8e93;margin-top:2px;}
  .memo canvas{width:100%;height:34px;display:block;margin-top:6px;}
  .memo .del{display:none;color:#ff453a;font-weight:600;font-size:15px;margin-right:10px;}
  #list.editing .memo .del{display:block;}
  #list.editing .memo{display:flex;align-items:center;}
  .empty{text-align:center;color:#8e8e93;font-size:15px;margin-top:80px;padding:0 48px;line-height:1.7;}
  .empty .mic{font-size:44px;display:block;margin-bottom:12px;}
  /* bottom record bar */
  #recbar{padding:14px 16px calc(20px + env(safe-area-inset-bottom));display:flex;align-items:center;
    justify-content:center;flex-shrink:0;border-top:.5px solid #1c1c1e;background:#000;}
  #recBtn{width:68px;height:68px;border-radius:50%;background:#ff3b30;border:none;cursor:pointer;
    box-shadow:0 0 0 6px rgba(255,59,48,.18);transition:transform .1s;}
  #recBtn:active{transform:scale(.93);}
  /* recording UI */
  #recUI{position:absolute;inset:0;background:#000;z-index:20;display:none;flex-direction:column;}
  #recUI.open{display:flex;}
  #recUI .rtop{padding:calc(16px + env(safe-area-inset-top)) 16px 0;display:flex;justify-content:space-between;align-items:center;}
  #recTimer{font-size:64px;font-weight:200;text-align:center;margin-top:26px;font-variant-numeric:tabular-nums;}
  #liveWave{flex:1;width:100%;}
  #recUI .rbot{padding:18px 16px calc(26px + env(safe-area-inset-bottom));display:flex;align-items:center;
    justify-content:space-around;}
  .rbtn{background:#1c1c1e;border:none;color:#fff;font-size:15px;padding:12px 22px;border-radius:22px;cursor:pointer;}
  .rbtn:active{opacity:.6;}
  #pauseBtn{width:64px;height:64px;border-radius:50%;background:#ff3b30;border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;}
  /* detail view */
  #detail{position:absolute;inset:0;background:#000;z-index:30;display:flex;flex-direction:column;
    transform:translateX(102%);transition:transform .28s cubic-bezier(.32,.72,.35,1);}
  #detail.open{transform:translateX(0);}
  #detail .dnav{padding:calc(12px + env(safe-area-inset-top)) 16px 0;display:flex;align-items:center;
    justify-content:space-between;flex-shrink:0;}
  #dName{font-size:20px;font-weight:700;text-align:center;margin:14px 20px 2px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;}
  #dDate{font-size:13px;color:#8e8e93;text-align:center;}
  #dWave{width:100%;height:150px;margin:18px 0 6px;cursor:pointer;}
  #dTime{display:flex;justify-content:space-between;padding:0 20px;font-size:13px;color:#8e8e93;
    font-variant-numeric:tabular-nums;}
  #dPlay{width:72px;height:72px;border-radius:50%;background:#1c1c1e;border:none;color:#fff;font-size:26px;
    cursor:pointer;margin:22px auto 8px;display:flex;align-items:center;justify-content:center;}
  #dPlay:active{opacity:.6;}
  #dSpeed{background:none;border:none;color:#0a84ff;font-size:15px;margin:0 auto;cursor:pointer;padding:6px;}
  #dActions{display:flex;justify-content:center;gap:34px;margin-top:26px;}
  #dActions button{background:none;border:none;color:#0a84ff;font-size:15px;cursor:pointer;padding:8px;}
  #dActions button:active{opacity:.5;}
  #dActions button.danger{color:#ff453a;}
  .spacer{flex:1;}
  /* modal */
  #modal{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
    background:rgba(0,0,0,.5);padding:44px;}
  #modal.open{display:flex;}
  #modal .box{background:#1c1c1e;border-radius:14px;width:100%;max-width:300px;overflow:hidden;text-align:center;}
  #modal .box h3{font-size:17px;margin:18px 16px 10px;font-weight:600;}
  #modal .box input{width:calc(100% - 32px);margin:0 16px 14px;padding:9px 10px;font-size:16px;
    border:.5px solid #38383a;border-radius:8px;background:#000;color:#fff;outline:none;font-family:inherit;}
  #modal .mrow{display:flex;border-top:.5px solid #38383a;}
  #modal .mrow button{flex:1;padding:13px;background:none;border:none;font-size:17px;color:#0a84ff;cursor:pointer;}
  #modal .mrow button + button{border-left:.5px solid #38383a;}
  #modal .mrow button.bold{font-weight:600;}
  #modal .mrow button.danger{color:#ff453a;}
  #err{position:absolute;top:calc(12px + env(safe-area-inset-top));left:14px;right:14px;z-index:70;
    background:rgba(28,28,30,.96);border:1px solid #38383a;border-radius:12px;padding:12px 14px;
    font-size:14px;display:none;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div id="phone">

  <div class="navbar">
    <div class="largetitle">Voice Memos</div>
    <button class="navbtn" id="editBtn">Edit</button>
  </div>
  <div class="searchbar">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke="#8e8e93" stroke-width="1.6"/><line x1="11" y1="11" x2="14.5" y2="14.5" stroke="#8e8e93" stroke-width="1.6" stroke-linecap="round"/></svg>
    <input id="search" placeholder="Search" autocomplete="off">
  </div>
  <div id="list"></div>

  <div id="recbar">
    <button id="recBtn" aria-label="Record"></button>
  </div>

  <!-- recording -->
  <div id="recUI">
    <div class="rtop">
      <button class="rbtn" id="recCancel">Cancel</button>
      <button class="rbtn" id="recDone" style="color:#0a84ff;font-weight:600;">Done</button>
    </div>
    <div id="recTimer">00:00</div>
    <canvas id="liveWave"></canvas>
    <div class="rbot">
      <span style="width:90px"></span>
      <button id="pauseBtn" aria-label="Pause"></button>
      <span style="width:90px"></span>
    </div>
  </div>

  <!-- detail -->
  <div id="detail">
    <div class="dnav">
      <button class="navbtn" id="dBack">‹ Back</button>
      <button class="navbtn" id="dRename">Rename</button>
    </div>
    <div id="dName"></div>
    <div id="dDate"></div>
    <canvas id="dWave"></canvas>
    <div id="dTime"><span id="dCur">0:00</span><span id="dDur">0:00</span></div>
    <button id="dPlay">▶</button>
    <button id="dSpeed">1×</button>
    <div id="dActions">
      <button id="dShare">Share</button>
      <button id="dDelete" class="danger">Delete</button>
    </div>
    <div class="spacer"></div>
  </div>

  <!-- modal -->
  <div id="modal"><div class="box">
    <h3 id="mTitle"></h3>
    <p id="mSub" style="font-size:13px;color:#8e8e93;margin:0 16px 12px;"></p>
    <input id="mInput" class="hidden">
    <div class="mrow">
      <button id="mCancel">Cancel</button>
      <button id="mOk" class="bold">OK</button>
    </div>
  </div></div>
  <div id="err"></div>
</div>

<script>
(function(){
"use strict";
const $ = id => document.getElementById(id);

/* ================= IndexedDB ================= */
function dbp(){
  return new Promise((res, rej)=>{
    const r = indexedDB.open('memos-v1', 1);
    r.onupgradeneeded = ()=> r.result.createObjectStore('recs', {keyPath:'id'});
    r.onsuccess = ()=> res(r.result);
    r.onerror = ()=> rej(r.error);
  });
}
async function dbTx(mode, fn){
  const db = await dbp();
  return new Promise((res, rej)=>{
    const tx = db.transaction('recs', mode);
    const st = tx.objectStore('recs');
    const out = fn(st);
    tx.oncomplete = ()=> res(out && out.result !== undefined ? out.result : out);
    tx.onerror = ()=> rej(tx.error);
  });
}
const dbAll = ()=> dbTx('readonly', st => st.getAll());
const dbPut = rec => dbTx('readwrite', st => st.put(rec));
const dbDel = id => dbTx('readwrite', st => st.delete(id));
const dbGet = id => new Promise(async (res,rej)=>{
  const db = await dbp();
  const tx = db.transaction('recs','readonly');
  const q = tx.objectStore('recs').get(id);
  q.onsuccess = ()=> res(q.result); q.onerror = ()=> rej(q.error);
});

/* ================= state ================= */
let recs = [];           // {id,name,ts,dur,blob?} blob loaded lazily
let editing = false;
const peakCache = {};   // id -> Float32Array peaks
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function fmtDur(s){ s=Math.max(0,Math.round(s)); const m=Math.floor(s/60);
  if(m>=60){ const h=Math.floor(m/60); return h+':'+String(m%60).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
  return m+':'+String(s%60).padStart(2,'0'); }
function fmtMMSS(s){ s=Math.max(0,Math.floor(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function fmtDate(ts){ return new Date(ts).toLocaleString([], {day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}); }
function showErr(m){ const e=$('err'); e.textContent=m; e.style.display='block';
  clearTimeout(showErr.t); showErr.t=setTimeout(()=>e.style.display='none',3500); }

/* ================= list ================= */
async function refresh(){
  const all = await dbAll();
  recs = all.map(r=>({id:r.id, name:r.name, ts:r.ts, dur:r.dur})).sort((a,b)=>b.ts-a.ts);
  renderList();
}
function renderList(){
  const q = $('search').value.trim().toLowerCase();
  const box = $('list'); box.innerHTML='';
  box.classList.toggle('editing', editing);
  $('editBtn').textContent = editing ? 'Done' : 'Edit';
  const list = recs.filter(r=>!q || r.name.toLowerCase().includes(q));
  if(!list.length){
    box.innerHTML = '<div class="empty"><span class="mic">🎙</span>'+
      (q?'No memos match your search.':'Tap the red button to record your first memo.<br>Everything stays on this device.')+'</div>';
    return;
  }
  list.forEach(r=>{
    const el = document.createElement('div'); el.className='memo';
    el.innerHTML = '<span class="del">−</span><div style="flex:1;min-width:0;">'+
      '<div class="top"><span class="nm"></span><span class="du"></span></div>'+
      '<div class="sub"></div><canvas width="600" height="68"></canvas></div>';
    el.querySelector('.nm').textContent = r.name;
    el.querySelector('.du').textContent = fmtDur(r.dur);
    el.querySelector('.sub').textContent = fmtDate(r.ts);
    el.querySelector('.del').addEventListener('click', e=>{ e.stopPropagation(); askDelete(r); });
    el.addEventListener('click', ()=>{ if(!editing) openDetail(r.id); });
    box.appendChild(el);
    drawMini(el.querySelector('canvas'), r.id);
  });
}
$('search').addEventListener('input', renderList);
$('editBtn').addEventListener('click', ()=>{ editing=!editing; renderList(); });

/* ================= waveforms ================= */
let actx = null;
function AC(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); 
  if(actx.state==='suspended') actx.resume(); return actx; }
async function getPeaks(id, n){
  if(peakCache[id]) return peakCache[id];
  try{
    const rec = await dbGet(id);
    if(!rec || !rec.blob) return null;
    const ab = await rec.blob.arrayBuffer();
    const buf = await AC().decodeAudioData(ab);
    const ch = buf.getChannelData(0);
    const step = Math.max(1, Math.floor(ch.length / n));
    const peaks = new Float32Array(n);
    for(let i=0;i<n;i++){
      let m=0;
      for(let j=i*step;j<Math.min((i+1)*step, ch.length);j+=7){ const a=Math.abs(ch[j]); if(a>m)m=a; }
      peaks[i]=m;
    }
    peakCache[id]=peaks; return peaks;
  }catch(e){ return null; }
}
function drawBars(cv, peaks, progress, color){
  const x = cv.getContext('2d'), W=cv.width, H=cv.height;
  x.clearRect(0,0,W,H);
  const n = peaks.length, bw = W/n;
  for(let i=0;i<n;i++){
    const h = Math.max(2, peaks[i]*H*0.92);
    const played = progress!=null && (i/n) <= progress;
    x.fillStyle = played ? '#0a84ff' : (color||'rgba(255,255,255,.75)');
    const bx = i*bw + bw*0.22;
    x.fillRect(bx, (H-h)/2, Math.max(1,bw*0.56), h);
  }
}
async function drawMini(cv, id){
  const p = await getPeaks(id, 120);
  if(p) drawBars(cv, p, null);
  else { // fallback shimmer
    const x=cv.getContext('2d'); x.fillStyle='rgba(255,255,255,.25)';
    for(let i=0;i<60;i++){ const h=6+Math.random()*22; x.fillRect(i*10+3,(68-h)/2,4,h); }
  }
}

/* ================= recording ================= */
let stream=null, mr=null, chunks=[], analyser=null, srcNode=null, rafId=0;
let recStart=0, recElapsed=0, paused=false, pauseStart=0, tickId=0;
const liveCv = $('liveWave'), liveCtx = liveCv.getContext('2d');
let liveData = [];

function sizeCanvas(cv){
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio||1;
  cv.width = Math.max(50, r.width*dpr); cv.height = Math.max(50, r.height*dpr);
}
function pickMime(){
  const cands = ['audio/webm;codecs=opus','audio/webm','audio/mp4'];
  if(!window.MediaRecorder) return '';
  return cands.find(c=>{ try{ return MediaRecorder.isTypeSupported(c); }catch(e){ return false; } }) || '';
}
$('recBtn').addEventListener('click', async ()=>{
  try{
    stream = await navigator.mediaDevices.getUserMedia({audio:true});
  }catch(e){ showErr('Microphone blocked. Allow mic access in the browser to record.'); return; }
  const mime = pickMime();
  try{ mr = mime ? new MediaRecorder(stream, {mimeType:mime}) : new MediaRecorder(stream); }
  catch(e){ showErr('Recording is not supported in this browser.'); stream.getTracks().forEach(t=>t.stop()); return; }
  chunks=[]; mr.ondataavailable = e=>{ if(e.data.size) chunks.push(e.data); };
  mr.onstop = onRecStop;
  // live analyser
  try{
    AC(); srcNode = actx.createMediaStreamSource(stream);
    analyser = actx.createAnalyser(); analyser.fftSize = 2048;
    srcNode.connect(analyser);
  }catch(e){ analyser=null; }
  mr.start(250);
  recStart = Date.now(); recElapsed=0; paused=false; liveData=[];
  $('recUI').classList.add('open');
  sizeCanvas(liveCv);
  tickId = setInterval(()=>{
    if(!paused){ recElapsed = (Date.now()-recStart)/1000; $('recTimer').textContent = fmtMMSS(recElapsed); }
  }, 250);
  $('recTimer').textContent='0:00';
  setPauseIcon(false);
  drawLive();
});
function setPauseIcon(p){
  $('pauseBtn').innerHTML = p
    ? '<svg width="22" height="22" viewBox="0 0 22 22" fill="#fff"><path d="M6 4l12 7-12 7z"/></svg>'
    : '<svg width="20" height="20" viewBox="0 0 20 20" fill="#fff"><rect x="4" y="3" width="4.5" height="14" rx="1"/><rect x="11.5" y="3" width="4.5" height="14" rx="1"/></svg>';
}
$('pauseBtn').addEventListener('click', ()=>{
  if(!mr) return;
  if(mr.state==='recording'){ mr.pause(); paused=true; pauseStart=Date.now(); }
  else if(mr.state==='paused'){ mr.resume(); paused=false; recStart += Date.now()-pauseStart; }
  setPauseIcon(paused);
});
function drawLive(){
  cancelAnimationFrame(rafId);
  const loop = ()=>{
    rafId = requestAnimationFrame(loop);
    const W=liveCv.width, H=liveCv.height;
    liveCtx.clearRect(0,0,W,H);
    let v=0;
    if(analyser && !paused){
      const d=new Uint8Array(analyser.fftSize);
      analyser.getByteTimeDomainData(d);
      let s=0; for(let i=0;i<d.length;i+=4){ const a=(d[i]-128)/128; s+=a*a; }
      v=Math.min(1, Math.sqrt(s/(d.length/4))*3);
    }
    liveData.push(v); if(liveData.length>220) liveData.shift();
    const mid=H/2, bw=W/220;
    liveData.forEach((p,i)=>{
      const h=Math.max(3, p*H*0.85);
      liveCtx.fillStyle = 'rgba(255,59,48,.9)';
      liveCtx.fillRect(W-(liveData.length-i)*bw, mid-h/2, Math.max(2,bw*0.55), h);
    });
  };
  loop();
}
function stopTracks(){ if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } }
$('recCancel').addEventListener('click', ()=>{
  if(mr){ mr.onstop=null; try{mr.stop();}catch(e){} }
  cleanupRec(); stopTracks();
});
$('recDone').addEventListener('click', ()=>{
  if(mr && (mr.state==='recording'||mr.state==='paused')){ try{mr.stop();}catch(e){} }
});
async function onRecStop(){
  const dur = recElapsed;
  cleanupRec(); stopTracks();
  const type = mr.mimeType || 'audio/webm';
  const blob = new Blob(chunks, {type});
  if(dur < 1 || !blob.size){ showErr('Recording too short — nothing saved.'); return; }
  const id = uid();
  const d = new Date();
  const name = 'New Recording ' + d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
  await dbPut({id, name, ts:Date.now(), dur, blob});
  await refresh();
}
function cleanupRec(){
  cancelAnimationFrame(rafId); clearInterval(tickId);
  $('recUI').classList.remove('open');
  mr=null; analyser=null;
}

/* ================= detail / playback ================= */
let curId=null, audio=null, curPeaks=null, dRaf=0;
const dCv = $('dWave');
async function openDetail(id){
  curId=id;
  const rec = recs.find(r=>r.id===id); if(!rec) return;
  stopAudio();
  $('dName').textContent = rec.name;
  $('dDate').textContent = fmtDate(rec.ts);
  $('dDur').textContent = fmtDur(rec.dur);
  $('dCur').textContent = '0:00';
  $('dSpeed').textContent = '1×';
  $('detail').classList.add('open');
  sizeCanvas(dCv);
  curPeaks = await getPeaks(id, 160);
  if(curPeaks) drawBars(dCv, curPeaks, 0);
  const full = await dbGet(id);
  if(full && full.blob){
    audio = new Audio(URL.createObjectURL(full.blob));
    audio.preservesPitch = true;
    audio.addEventListener('timeupdate', ()=>{
      if(curPeaks && audio.duration) drawBars(dCv, curPeaks, audio.currentTime/audio.duration);
      $('dCur').textContent = fmtMMSS(audio.currentTime||0);
    });
    audio.addEventListener('ended', ()=>{ $('dPlay').textContent='▶'; if(curPeaks) drawBars(dCv,curPeaks,0); });
  }
}
function stopAudio(){ if(audio){ audio.pause(); audio=null; } cancelAnimationFrame(dRaf); }
$('dBack').addEventListener('click', ()=>{ stopAudio(); $('detail').classList.remove('open'); curId=null; });
$('dPlay').addEventListener('click', ()=>{
  if(!audio) return;
  if(audio.paused){ audio.play().catch(()=>showErr('Playback failed.')); $('dPlay').textContent='⏸'; }
  else { audio.pause(); $('dPlay').textContent='▶'; }
});
dCv.addEventListener('click', (e)=>{
  if(!audio || !audio.duration || !curPeaks) return;
  const r = dCv.getBoundingClientRect();
  audio.currentTime = ((e.clientX-r.left)/r.width) * audio.duration;
});
$('dSpeed').addEventListener('click', ()=>{
  if(!audio) return;
  const speeds=[1,1.25,1.5,2]; const i=(speeds.indexOf(audio.playbackRate)+1)%speeds.length;
  audio.playbackRate=speeds[i]; $('dSpeed').textContent=speeds[i]+'×';
});
$('dRename').addEventListener('click', ()=>{
  const rec = recs.find(r=>r.id===curId); if(!rec) return;
  promptModal('Rename', rec.name, (name)=>{
    if(!name.trim()) return;
    dbGet(curId).then(full=>{ full.name=name.trim(); return dbPut(full); })
      .then(()=>{ rec.name=name.trim(); $('dName').textContent=rec.name; renderList(); });
  });
});
function askDelete(r){
  confirmModal('Delete "'+r.name+'"?', 'This memo will be permanently deleted.', async ()=>{
    await dbDel(r.id); delete peakCache[r.id];
    if(curId===r.id){ stopAudio(); $('detail').classList.remove('open'); curId=null; }
    await refresh();
  });
}
$('dDelete').addEventListener('click', ()=>{
  const rec = recs.find(r=>r.id===curId); if(rec) askDelete(rec);
});
$('dShare').addEventListener('click', async ()=>{
  const full = await dbGet(curId); if(!full||!full.blob) return;
  const ext = (full.blob.type||'').includes('mp4') ? 'm4a' : 'webm';
  const file = new File([full.blob], full.name+'.'+ext, {type: full.blob.type});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title: full.name}); }catch(e){}
  } else {
    const a=document.createElement('a');
    a.href=URL.createObjectURL(full.blob); a.download=file.name;
    document.body.appendChild(a); a.click(); a.remove();
  }
});

/* ================= modal ================= */
let modalCb=null;
function promptModal(title, initial, cb){
  modalCb=cb; $('mTitle').textContent=title; $('mSub').textContent='';
  $('mInput').classList.remove('hidden'); $('mInput').value=initial||'';
  $('mOk').textContent='Save'; $('mOk').classList.add('bold'); $('mOk').classList.remove('danger');
  $('modal').classList.add('open'); setTimeout(()=>$('mInput').focus(),80);
}
function confirmModal(title, sub, cb){
  modalCb=()=>cb(true); $('mTitle').textContent=title; $('mSub').textContent=sub||'';
  $('mInput').classList.add('hidden');
  $('mOk').textContent='Delete'; $('mOk').classList.remove('bold'); $('mOk').classList.add('danger');
  $('modal').classList.add('open');
}
$('mCancel').addEventListener('click', ()=>$('modal').classList.remove('open'));
$('mOk').addEventListener('click', ()=>{
  $('modal').classList.remove('open');
  const v = $('mInput').classList.contains('hidden') ? true : $('mInput').value;
  if(modalCb) modalCb(v); modalCb=null;
});

/* ================= boot ================= */
refresh();
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
})();
</script>
